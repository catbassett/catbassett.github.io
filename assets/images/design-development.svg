      <path d="M12 136 C42 108 60 84 72 31 M51 145 C78 110 105 86 141 68" fill="none" stroke="#496657" stroke-width="6" stroke-linecap="round"/>
      <path d="M48 92 C22 79 19 61 45 58 C57 70 58 84 48 92Z M78 74 C104 57 121 62 121 85 C104 93 89 88 78 74Z" fill="#79917e"/>
      <g transform="translate(63 38)">
