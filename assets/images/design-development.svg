        <ellipse rx="18" ry="9" fill="#c86e76" transform="rotate(60)"/>
        <ellipse rx="18" ry="9" fill="#c86e76" transform="rotate(120)"/>
        <circle r="7" fill="#ecb75d"/>
      </g>
      <g transform="translate(119 113)">
