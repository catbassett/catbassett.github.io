  <rect x="188" y="188" width="824" height="824" rx="5" fill="#fbf8f2" stroke="#171816" stroke-width="4"/>
  <text x="600" y="292" fill="#5e655f" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">DESIGN + DEVELOPMENT</text>
  <line x1="282" y1="328" x2="918" y2="328" stroke="#d7cfc2" stroke-width="3"/>
  <text x="600" y="433" fill="#161616" font-family="Helvetica, Arial, sans-serif" font-size="57" font-weight="700" letter-spacing="-3" text-anchor="middle">RIVER ISLAND</text>
