  <text x="629" y="805" fill="#151515" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="300" letter-spacing="3">STORES</text>
  <text x="600" y="857" fill="#873649" font-family="Georgia, serif" font-size="64" font-style="italic" text-anchor="middle">nutmeg</text>
  <text x="600" y="937" fill="#151515" font-family="Helvetica, Arial, sans-serif" font-size="59" font-weight="900" letter-spacing="-5" text-anchor="middle">NEXT</text>
