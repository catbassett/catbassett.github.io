<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Design and Development</title>
  <desc id="desc">A floral-framed panel featuring retail brand wordmarks.</desc>
  <defs>
